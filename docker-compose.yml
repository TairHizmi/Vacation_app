version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: vacation_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: vacation_app
      MYSQL_USER: vacation_user
      MYSQL_PASSWORD: vacation_pass
    ports:
      - '3306:3306' 
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vacation-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: vacation_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - '8080:80'
    networks:
      - vacation-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vacation_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass123
      DB_NAME: vacation_app
      UPLOAD_DIR: public/uploads
      API_KEY: ${API_KEY}
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - vacation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vacation_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_APP_BASE_URL: http://localhost:5000/api
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vacation-network

networks:
  vacation-network:
    driver: bridge

volumes:
  db_data:
    driver: local
